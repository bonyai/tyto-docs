# Sprint 16 public surface (#248, frozen 2026-08-01). Paths are singular by
# owner ruling. Runtime handlers and constants stay authoritative; this OpenAPI
# document is the public REST contract exposed behind Caddy.
openapi: 3.1.0
info:
  title: Bonya Compute REST API
  version: 0.1.0
  description: >
    Public REST and WebSocket surface on TApi behind Caddy. Non-2xx responses
    are RFC 9457 application/problem+json with a stable machine-readable code.
    WebSocket endpoints are HTTP GET upgrades; their options travel in the
    START frame, never in query strings.
security:
  - personalApiKey: []
  - supabaseJwt: []
paths:
  /v1/sandbox:
    get:
      operationId: listSandboxes
      summary: List sandboxes (page_size, page_token, states; DELETED is not filterable)
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: page_token
          in: query
          schema: { type: string }
        - name: states
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/SandboxState' }
          style: form
          explode: true
        - name: name
          in: query
          description: >-
            Exact-match filter. Names are not unique, so this can match more
            than one sandbox.
          schema: { type: string }
      responses:
        '200':
          description: Sandbox page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxPage' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createSandbox
      summary: Create a sandbox (202; ?wait=ready blocks to 201)
      parameters:
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: wait
          in: query
          schema: { type: string, enum: [ready] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SandboxCreate' }
      responses:
        '201':
          description: Created and ready (wait=ready)
          content:
            application/json:
              schema:
                type: object
                required: [sandbox]
                properties: { sandbox: { $ref: '#/components/schemas/Sandbox' } }
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [sandbox]
                properties: { sandbox: { $ref: '#/components/schemas/Sandbox' } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/templates:
    get:
      operationId: listTemplates
      summary: >
        The deployment's immutable template catalog: every template_id and
        version Create/RunJob will accept, and which version each template_id
        resolves to when a caller omits version. Same catalog for every
        caller; no organization context.
      responses:
        '200':
          description: Template catalog
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: '#/components/schemas/Template' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
      - $ref: '#/components/parameters/OrganizationHeader'
    get:
      operationId: getSandbox
      responses:
        '200':
          description: Sandbox
          content:
            application/json:
              schema:
                type: object
                required: [sandbox]
                properties: { sandbox: { $ref: '#/components/schemas/Sandbox' } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteSandbox
      summary: Synchronous teardown; repeat delete of a tombstone is 204; unknown or cross-org is 404
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/resume:
    post:
      operationId: resumeSandbox
      summary: Synchronous resume; already_running is 200
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
      responses:
        '200':
          description: Running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxResume' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/previews:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
      - $ref: '#/components/parameters/OrganizationHeader'
    get:
      operationId: listPreviews
      summary: List preview URLs for a sandbox; never returns capabilities
      responses:
        '200':
          description: Preview list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewListResponse' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createPreview
      summary: Create a preview URL; returns a token-free URL plus capability exactly once
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreviewCreateRequest' }
      responses:
        '201':
          description: Preview created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreviewCreateResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/previews/{preview_id}:
    delete:
      operationId: deletePreview
      summary: Idempotently delete a preview URL without leaking cross-org existence
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/PreviewID'
        - $ref: '#/components/parameters/OrganizationHeader'
      responses:
        '204': { description: Deleted }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/exec:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
      - $ref: '#/components/parameters/OrganizationHeader'
    post:
      operationId: execDirect
      summary: Buffered non-TTY exec; JSON body only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DirectExecRequest' }
      responses:
        '200':
          description: Exec finished (exit state in body)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectExecResponse' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      operationId: execTTY
      summary: Transient TTY over WebSocket (upgrade; START frame carries TTYStartRequest)
      responses:
        '101': { description: Switching protocols; admission happens at START }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/sessions:
    parameters:
      - $ref: '#/components/parameters/SandboxID'
      - $ref: '#/components/parameters/OrganizationHeader'
    get:
      operationId: listSessions
      summary: Never wakes; suspended sandboxes answer from the suspend snapshot
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionListResponse' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createSession
      summary: Name-keyed create; live duplicate is 409 session_exists; replace applies to terminal sessions only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionCreateRequest' }
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/sessions/{session_name}/attach:
    get:
      operationId: attachSession
      summary: Session attach over WebSocket (upgrade; START frame carries AttachStartRequest)
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/SessionName'
        - $ref: '#/components/parameters/OrganizationHeader'
      responses:
        '101': { description: Switching protocols; admission happens at START }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/sessions/{session_name}/kill:
    post:
      operationId: killSession
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/SessionName'
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionKillRequest' }
      responses:
        '200':
          description: Signal delivered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/fs/read:
    get:
      operationId: fsRead
      summary: Raw file bytes
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/FsPath'
      responses:
        '200':
          description: File contents
          content:
            application/octet-stream: {}
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/fs/write:
    put:
      operationId: fsWrite
      summary: Raw file bytes
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/FsPath'
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        '204': { description: Written }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/fs/list:
    get:
      operationId: fsList
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/FsPath'
      responses:
        '200':
          description: Directory entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsListResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/fs/stat:
    get:
      operationId: fsStat
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/FsPath'
      responses:
        '200':
          description: File metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsStatResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/fs/mkdir:
    post:
      operationId: fsMkdir
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FsMkdirRequest' }
      responses:
        '201': { description: Directory created }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/fs/rename:
    post:
      operationId: fsRename
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FsRenameRequest' }
      responses:
        '200': { description: Renamed }
        default: { $ref: '#/components/responses/Problem' }
  /v1/sandbox/{sandbox_id}/fs:
    delete:
      operationId: fsDelete
      parameters:
        - $ref: '#/components/parameters/SandboxID'
        - $ref: '#/components/parameters/OrganizationHeader'
        - $ref: '#/components/parameters/FsPath'
        - name: recursive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }
  # Organization administration is JWT-only throughout -- all seven
  # operations from here to the member sub-resource below, alongside the
  # invitation surface that was already dashboard-only and x-internal.
  #
  # This document originally left every one of them on the root "API key OR
  # JWT" security. That was unflagged drift rather than a recorded decision,
  # and it was wrong twice over: #248's provisioning paragraph names GET and
  # POST /v1/organizations among the five JWT-authenticated operations, and
  # the five sub-resource operations have refused API keys since S16.2
  # shipped the Management posture -- the document was describing behavior
  # the server never had. Corrected in S16.3 (#251); the handlers did not
  # change.
  /v1/organizations:
    get:
      operationId: listOrganizations
      security:
        - supabaseJwt: []
      summary: >
        Organizations the caller belongs to, with their role in each. JWT
        provisioning operation; API keys are refused.
      responses:
        '200':
          description: Organizations for the caller
          content:
            application/json:
              schema:
                type: object
                required: [organizations]
                properties:
                  organizations:
                    type: array
                    items: { $ref: '#/components/schemas/Organization' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createOrganization
      security:
        - supabaseJwt: []
      summary: >
        Create an organization owned by the caller. JWT provisioning
        operation; API keys are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationWrite' }
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                type: object
                required: [organization]
                properties:
                  organization: { $ref: '#/components/schemas/Organization' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/organizations/{organization_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: getOrganization
      security:
        - supabaseJwt: []
      summary: Any member may read; a non-member is 404, never 403
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                type: object
                required: [organization]
                properties:
                  organization: { $ref: '#/components/schemas/Organization' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateOrganization
      security:
        - supabaseJwt: []
      summary: Rename; owner only. Organization deletion is out of scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrganizationWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [organization]
                properties:
                  organization: { $ref: '#/components/schemas/Organization' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/organizations/{organization_id}/members:
    get:
      operationId: listMembers
      security:
        - supabaseJwt: []
      summary: Any member may list
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/Member' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/organizations/{organization_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
      - name: user_id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateMember
      security:
        - supabaseJwt: []
      summary: Owner only. Demoting the final owner is 409 final_owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [member]
                properties:
                  member: { $ref: '#/components/schemas/Member' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: removeMember
      security:
        - supabaseJwt: []
      summary: >
        Administrative removal (owner only) and member self-leave share this
        verb. Removing the final owner is 409 final_owner, which is also why
        the sole owner of a personal organization cannot leave it.
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Problem' }
  # The nested segment is /invites, exactly as the #248 surface table writes
  # it; the acceptance path below is /v1/invitations/accept, also verbatim.
  # The asymmetry is the frozen contract's, not this document's to smooth.
  /v1/organizations/{organization_id}/invites:
    parameters:
      - $ref: '#/components/parameters/OrganizationID'
    get:
      operationId: listInvites
      x-internal: true
      security:
        - supabaseJwt: []
      summary: Dashboard-facing; Supabase JWT required, API keys rejected. Owner only.
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: { $ref: '#/components/schemas/Invitation' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createInvite
      x-internal: true
      security:
        - supabaseJwt: []
      summary: >
        Dashboard-facing; owner only. The response carries the raw token
        exactly once and no acceptance URL: the dashboard builds
        .../invitations/accept#token=... itself, because TApi does not know
        the dashboard's origin. A live invitation already addressed to the
        same address is 409 lifecycle_conflict; a personal organization is
        400 validation_failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201':
          description: Invitation created; body carries the token once
          content:
            application/json:
              schema:
                type: object
                required: [invitation, token]
                properties:
                  invitation: { $ref: '#/components/schemas/Invitation' }
                  token:
                    type: string
                    description: >
                      Shown exactly once. Belongs in the URL fragment of an
                      invite link, never in a path or query string.
        default: { $ref: '#/components/responses/Problem' }
  /v1/organizations/{organization_id}/invites/{invitation_id}:
    delete:
      operationId: revokeInvite
      x-internal: true
      security:
        - supabaseJwt: []
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - name: invitation_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoked }
        default: { $ref: '#/components/responses/Problem' }
  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      x-internal: true
      security:
        - supabaseJwt: []
      summary: >
        Dashboard-facing; the dashboard reads the token from the URL fragment
        and posts it in the body. The invitation must have been issued to the
        authenticated caller's own address, compared case-insensitively; a
        token alone is not enough. A valid acceptance provisions and consumes
        the invite in one transaction; an invalid or replayed one rolls back
        with nothing provisioned. Unknown, addressed-to-someone-else,
        consumed, revoked and expired tokens are one indistinguishable 404,
        and a mismatched attempt leaves the invitation live for its
        recipient. JWT provisioning operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [organization]
                properties:
                  organization: { $ref: '#/components/schemas/Organization' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/api-keys:
    get:
      operationId: listApiKeys
      security:
        - supabaseJwt: []
      summary: JWT-only; keys can never manage keys. JWT provisioning operation.
      responses:
        '200':
          description: Keys (prefix and last4 only)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIKeyListResponse' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createApiKey
      security:
        - supabaseJwt: []
      summary: JWT-only; the secret is shown exactly once. JWT provisioning operation.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/APIKeyCreateRequest' }
      responses:
        '201':
          description: Key created; body carries the secret once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APIKeyCreateResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/api-keys/{key_id}:
    delete:
      operationId: revokeApiKey
      security:
        - supabaseJwt: []
      summary: JWT-only
      parameters:
        - name: key_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoked }
        default: { $ref: '#/components/responses/Problem' }
  # Device-authorization login (#299): `tyto login` opens a browser instead of
  # asking for a pasted API key. Three legs, none of them carrying the same
  # credential as the others: mint and poll are unauthenticated at the header
  # level because the token itself is the credential (mirroring how
  # acceptInvitation's token works), and approve is JWT-only because it is the
  # already-signed-in browser session vouching for a login it did not start.
  /v1/device-login:
    post:
      operationId: mintDeviceLogin
      security: []
      summary: >
        Unauthenticated; mints a single-use device-login token and the
        dashboard URL the CLI opens a browser to. No request body.
      responses:
        '201':
          description: Token minted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceLoginMintResponse' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/device-login/approve:
    post:
      operationId: approveDeviceLogin
      security:
        - supabaseJwt: []
      summary: JWT-only; approves a CLI device-login token. JWT provisioning operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceLoginApproveRequest' }
      responses:
        '204': { description: Approved }
        default: { $ref: '#/components/responses/Problem' }
  /v1/device-login/poll:
    post:
      operationId: pollDeviceLogin
      security: []
      summary: >
        Unauthenticated; the token in the body is the credential. Always 200:
        pending, approved (carries the api_key exactly once), or expired.
        An unknown token is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceLoginApproveRequest' }
      responses:
        '200':
          description: Poll result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceLoginPollResponse' }
        default: { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase-issued session JWT; required for org, invite, and key management.
    personalApiKey:
      type: http
      scheme: bearer
      description: Personal byk_ API key; user-principal, resolved to a tenant by org context.
  parameters:
    OrganizationHeader:
      name: X-Bonya-Organization-ID
      in: header
      required: false
      schema: { type: string }
      description: >
        Org context. Omitted means the caller's personal organization. A
        well-formed non-member org is 404; malformed is 400.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
      description: >
        Absent means server-generated, which provides no deduplication; only
        client-supplied keys dedupe.
    SandboxID:
      name: sandbox_id
      in: path
      required: true
      schema: { type: string }
    PreviewID:
      name: preview_id
      in: path
      required: true
      schema: { type: string, pattern: '^pv-[a-z2-7]{26}$' }
    SessionName:
      name: session_name
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$' }
    OrganizationID:
      name: organization_id
      in: path
      required: true
      schema: { type: string }
    FsPath:
      name: path
      in: query
      required: true
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
    SandboxState:
      type: string
      enum: [CREATING, RUNNING, SUSPENDING, SUSPENDED, RESUMING, FAILED]
    Sandbox:
      type: object
      required: [sandbox_id, operation_id, template_id, template_version, state]
      properties:
        sandbox_id: { type: string }
        operation_id: { type: string }
        template_id: { type: string }
        template_version: { type: string }
        state: { $ref: '#/components/schemas/SandboxState' }
        failure_code: { type: string }
        failure_message: { type: string }
        # Absent on sandboxes created before names existed; every other
        # response carries one, generated when create did not supply it.
        name: { type: string }
    SandboxPage:
      type: object
      required: [sandboxes, next_page_token]
      properties:
        sandboxes:
          type: array
          items: { $ref: '#/components/schemas/Sandbox' }
        next_page_token: { type: string }
    SandboxCreate:
      type: object
      properties:
        template_id:
          type: string
          description: >-
            Omit to use the deployment's configured default template, if it
            has one; otherwise required.
        template_version: { type: string }
        network: { $ref: '#/components/schemas/NetworkPolicy' }
        # Optional display label. Blank or omitted means the service generates
        # a friendly one. Names are not unique and address nothing: every
        # lookup is by sandbox_id.
        name: { type: string, maxLength: 80 }
    NetworkPolicy:
      type: object
      additionalProperties: false
      properties:
        mode: { type: string, enum: [standard, deny_all, custom], default: standard }
        allow:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/NetworkRule' }
      allOf:
        - if:
            required: [mode]
            properties: { mode: { const: custom } }
          then:
            required: [allow]
            properties: { allow: { minItems: 1 } }
          else:
            properties: { allow: { maxItems: 0 } }
    NetworkRule:
      type: object
      additionalProperties: false
      required: [cidr]
      properties:
        cidr: { type: string }
        ports:
          type: array
          items: { type: integer, minimum: 1, maximum: 65535 }
    SandboxResume:
      type: object
      required: [sandbox_id, already_running]
      properties:
        sandbox_id: { type: string }
        already_running: { type: boolean }
    PreviewAuthMode:
      type: string
      enum: [token, public]
      default: token
      description: >
        Token mode uses the shipped Roxy browser exchange. The client may
        navigate once to preview.url with ?bonya_token=capability_jws; Roxy
        validates it, sets the host-scoped Secure HttpOnly preview cookie, and
        redirects to the same URL with bonya_token removed before guest
        content is rendered.
    Preview:
      type: object
      required: [preview_id, sandbox_id, port, auth_mode, url, created_at_unix_nanos]
      properties:
        preview_id: { type: string, pattern: '^pv-[a-z2-7]{26}$' }
        sandbox_id: { type: string }
        port: { type: integer, minimum: 1024, maximum: 65535 }
        auth_mode: { $ref: '#/components/schemas/PreviewAuthMode' }
        name:
          type: string
          description: Display metadata only; at most 80 UTF-8 bytes.
        url:
          type: string
          format: uri
          description: Token-free base preview URL.
        created_at_unix_nanos: { type: integer }
    PreviewCreateRequest:
      type: object
      additionalProperties: false
      required: [port]
      properties:
        port: { type: integer, minimum: 1024, maximum: 65535 }
        auth_mode: { $ref: '#/components/schemas/PreviewAuthMode' }
        name:
          type: string
          description: Display metadata only; at most 80 UTF-8 bytes.
    PreviewCreateResponse:
      type: object
      required: [preview, capability_jws]
      properties:
        preview: { $ref: '#/components/schemas/Preview' }
        capability_jws:
          type: string
          description: >
            Returned only by create. It may be appended as bonya_token for one
            browser exchange, but must not be stored in URLs or logs.
    PreviewListResponse:
      type: object
      required: [previews]
      properties:
        previews:
          type: array
          items: { $ref: '#/components/schemas/Preview' }
    Role:
      type: string
      enum: [owner, member]
      default: member
      description: Custom roles are out of scope; the set is closed.
    Template:
      type: object
      required: [template_id, version, digest, is_default, metadata]
      properties:
        template_id: { type: string }
        version: { type: string }
        digest: { type: string }
        is_default:
          type: boolean
          description: >
            True if this is the version its template_id resolves to when a
            Create/RunJob request omits version.
        metadata: { $ref: '#/components/schemas/TemplateMetadata' }
    TemplateMetadata:
      type: object
      description: Optional facts about the template's operating system and tools.
      properties:
        description: { type: string }
        os: { type: string }
        os_version: { type: string }
        stacks:
          type: array
          items: { $ref: '#/components/schemas/TemplateStack' }
        agent_cli_support:
          type: array
          items: { type: string }
    TemplateStack:
      type: object
      required: [name, version]
      properties:
        name: { type: string }
        version: { type: string }
    Organization:
      type: object
      required: [organization_id, name, personal, created_at]
      properties:
        organization_id: { type: string, pattern: '^org-[0-9a-f]{32}$' }
        name: { type: string, maxLength: 128 }
        personal:
          type: boolean
          description: >
            True for the caller's personal organization, the deterministic
            tenant an omitted org context resolves to. Personal
            organizations cannot be invited into.
        role:
          allOf:
            - $ref: '#/components/schemas/Role'
          description: The requesting caller's role, when known.
        created_at: { type: string, format: date-time }
    OrganizationWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
    Member:
      type: object
      required: [user_id, email, role, joined_at]
      properties:
        user_id: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        joined_at: { type: string, format: date-time }
    Invitation:
      type: object
      required: [invitation_id, organization_id, email, role, invited_by_user_id, status, created_at, expires_at]
      properties:
        invitation_id: { type: string }
        organization_id: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        invited_by_user_id: { type: string }
        status:
          type: string
          enum: [live, expired, consumed, revoked]
          description: >
            Derived lifecycle. Consumed and revoked outrank expiry, so an
            invitation that was used and later passed its expiry reads
            consumed.
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        consumed_at: { type: string, format: date-time }
        consumed_by_user_id: { type: string }
        revoked_at: { type: string, format: date-time }
    APIKey:
      type: object
      required: [key_id, display_prefix, display_last4, created_at]
      properties:
        key_id: { type: string }
        name: { type: string, maxLength: 128 }
        display_prefix: { type: string }
        display_last4: { type: string }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
    APIKeyListResponse:
      type: object
      required: [api_keys]
      properties:
        api_keys:
          type: array
          items: { $ref: '#/components/schemas/APIKey' }
    APIKeyCreateRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 128 }
    APIKeyCreateResponse:
      type: object
      required: [api_key, secret]
      properties:
        api_key: { $ref: '#/components/schemas/APIKey' }
        secret:
          type: string
          description: Shown exactly once. Store it as a user-principal API key.
    DeviceLoginMintResponse:
      type: object
      required: [token, verification_url, expires_in, interval]
      properties:
        token: { type: string, description: The byd_ device-login token; also embedded in verification_url. }
        verification_url: { type: string, description: Dashboard URL the caller opens a browser to. }
        expires_in: { type: integer, description: Seconds until the token expires unapproved. }
        interval: { type: integer, description: Recommended seconds between poll calls. }
    DeviceLoginApproveRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, description: The byd_ device-login token from the verification URL. }
    DeviceLoginPollResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, approved, expired] }
        api_key:
          type: string
          description: Present only once, on the single poll that observes "approved".
        user_email:
          type: string
          description: The approving user's email; present alongside api_key.
    CommandSpec:
      type: object
      required: [cmd]
      properties:
        cmd:
          type: array
          items: { type: string }
          minItems: 1
        env:
          type: object
          additionalProperties: { type: string }
        path: { type: string }
    DirectExecRequest:
      allOf:
        - $ref: '#/components/schemas/CommandSpec'
        - type: object
          properties:
            timeout_s: { type: integer, minimum: 1, maximum: 300 }
            stdin_b64: { type: string, contentEncoding: base64 }
            output_encoding: { type: string, enum: [utf8, base64] }
    DirectExecResponse:
      type: object
      required: [exit_code, signaled, timed_out, stdout, stderr, stdout_truncated, stderr_truncated, output_encoding]
      properties:
        exit_code: { type: integer }
        signaled: { type: boolean }
        signal: { type: integer }
        timed_out: { type: boolean }
        stdout: { type: string }
        stderr: { type: string }
        stdout_truncated: { type: boolean }
        stderr_truncated: { type: boolean }
        output_encoding: { type: string, enum: [utf8, base64] }
    SessionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/CommandSpec'
        - type: object
          required: [name]
          properties:
            name: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$' }
            cols: { type: integer, minimum: 1, maximum: 512 }
            rows: { type: integer, minimum: 1, maximum: 512 }
            replace: { type: boolean, default: false }
    SessionKillRequest:
      type: object
      properties:
        signal: { type: string, enum: [TERM, KILL, INT, HUP], default: TERM }
        grace_ms: { type: integer, minimum: 0, maximum: 60000, default: 5000 }
    SessionExit:
      type: object
      required: [exit_code, signaled, signal]
      properties:
        exit_code: { type: integer }
        signaled: { type: boolean }
        signal: { type: integer }
    SessionInfo:
      type: object
      required: [name, command, working_dir, status, attached, started_at_unix_nanos, last_activity_unix_nanos]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$' }
        command:
          type: array
          items: { type: string }
        working_dir: { type: string }
        status: { type: string, enum: [UNSPECIFIED, STARTING, IDLE, ATTACHED, EXITED, KILLED, FAILED] }
        attached: { type: boolean }
        started_at_unix_nanos: { type: integer }
        last_activity_unix_nanos: { type: integer }
        ended_at_unix_nanos: { type: integer }
        exit: { $ref: '#/components/schemas/SessionExit' }
    SessionResponse:
      type: object
      required: [session]
      properties:
        session: { $ref: '#/components/schemas/SessionInfo' }
    SessionListResponse:
      type: object
      required: [sessions, sandbox_suspended]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/SessionInfo' }
        sandbox_suspended:
          type: boolean
    FsFileInfo:
      type: object
      required: [path, name, kind, size, mode, modified_at_unix_nanos]
      properties:
        path: { type: string }
        name: { type: string }
        kind: { type: string, enum: [UNSPECIFIED, FILE, DIRECTORY, SYMLINK, OTHER] }
        size: { type: integer, minimum: 0 }
        mode:
          type: integer
          minimum: 0
          maximum: 4095
          description: Permission bits as reported by the guest.
        modified_at_unix_nanos: { type: integer }
    FsListResponse:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/FsFileInfo' }
    FsStatResponse:
      type: object
      required: [file]
      properties:
        file: { $ref: '#/components/schemas/FsFileInfo' }
    FsMkdirRequest:
      type: object
      required: [path]
      properties:
        path: { type: string }
    FsRenameRequest:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
